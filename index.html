<script>
let rawData = [];
let charts = {};
let activeStateDrilldown = "Maharashtra";

// Helpers
const num = v => { if(!v) return 0; const s = String(v).replace(/,/g,'').replace(/₹/g,'').trim(); if(s===''||s==='*'||s==='#N/A'||s==='NULL') return 0; const n = parseFloat(s); return isNaN(n) ? 0 : n; };
const fmtINR = n => n >= 10000000 ? '₹'+(n/10000000).toFixed(2)+' Cr' : n >= 100000 ? '₹'+(n/100000).toFixed(2)+' L' : '₹'+Math.round(n);
const fmtNum = n => new Intl.NumberFormat('en-IN').format(Math.round(n));

// Navigation
function showPage(id, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

// Show Error on Screen instead of spinning forever
function showError(msg) {
  const loader = document.getElementById('loader');
  loader.innerHTML = `
    <div style="background:#ffebee; color:#c62828; padding:30px; border-radius:10px; max-width:550px; text-align:center; font-family:sans-serif; box-shadow:0 4px 15px rgba(0,0,0,0.1);">
      <h2 style="margin-bottom:15px;">⚠️ Failed to Load Data</h2>
      <p style="font-size:14px; margin-bottom:20px;">${msg}</p>
      <hr style="border:0; border-top:1px solid #ef9a9a; margin:15px 0;">
      <p style="font-size:13px; color:#555; text-align:left;">
        <strong>How to fix this:</strong><br>
        1. Make sure the file is named exactly <code>data.csv</code> (not <code>data.csv.txt</code>).<br>
        2. Make sure it is in the exact same folder as <code>index.html</code>.<br>
        3. Do not open the HTML by double-clicking it. Use GitHub Pages or run a local server (e.g., <code>python -m http.server 8000</code>).
      </p>
    </div>
  `;
}

// Load CSV
Papa.parse('./data.csv', {
  download: true, header: true, skipEmptyLines: true,
  complete: res => {
    try {
      if (!res.data || res.data.length === 0) {
        showError("The CSV file loaded, but it appears to be empty.");
        return;
      }
      rawData = res.data.filter(r => r['Franchise Code']);
      if(rawData.length === 0) {
        showError("Data loaded, but the column 'Franchise Code' is missing. Check your CSV headers.");
        return;
      }
      initApp();
    } catch (e) {
      showError("A script error occurred: " + e.message);
    }
  },
  error: err => {
    showError("Could not fetch <code>data.csv</code>. The file might be missing, or you are opening the HTML file directly from your hard drive (file:// protocol).");
  }
});

function initApp() {
  const ts = new Date().toLocaleString();
  document.querySelectorAll('.timestamp').forEach(el => el.textContent = 'Last Refreshed: ' + ts);
  
  populateFilters();
  renderPage1();
  renderPage2();
  renderPage3();
  renderTable();
  document.getElementById('loader').style.display = 'none';
}

function populateFilters() {
  const fillSelect = (id, key) => {
    const arr = [...new Set(rawData.map(r => r[key]).filter(Boolean))].sort();
    const sel = document.getElementById(id);
    arr.forEach(v => { const o = document.createElement('option'); o.value = v; o.textContent = v; sel.appendChild(o); });
  };
  fillSelect('fState', 'State Name');
  fillSelect('fZone', 'Zone');
  fillSelect('fType', 'Franchise Type');
}

// --- PAGE 1 ---
function renderPage1() {
  const active = rawData.filter(r => (r['Active 26-27'] || '').toLowerCase().includes('yes')).length;
  const states = new Set(rawData.map(r => r['State Name']).filter(Boolean));
  const districts = new Set(rawData.map(r => r['District Name']).filter(Boolean));
  const cities = new Set(rawData.map(r => r['City Name']).filter(Boolean));
  const owners = new Set(rawData.map(r => r['owner Name']).filter(Boolean));
  const rev26 = rawData.reduce((s,r) => s + num(r['FY 2026-27 Total Purchase']), 0);

  document.getElementById('kpiTotal').textContent = fmtNum(rawData.length);
  document.getElementById('kpiActive').textContent = fmtNum(active);
  document.getElementById('kpiInactive').textContent = fmtNum(rawData.length - active);
  document.getElementById('kpiStates').textContent = fmtNum(states.size);
  document.getElementById('kpiDistricts').textContent = fmtNum(districts.size);
  document.getElementById('kpiCities').textContent = fmtNum(cities.size);
  document.getElementById('kpiOwners').textContent = fmtNum(owners.size);
  document.getElementById('kpiRev26').textContent = fmtINR(rev26);

  const stateMap = {};
  rawData.forEach(r => { const s = r['State Name'] || 'Unknown'; stateMap[s] = (stateMap[s] || 0) + 1; });
  const sortedStates = Object.entries(stateMap).sort((a,b) => b[1]-a[1]).slice(0, 10);
  
  drawChart('topStatesChart', 'bar', {
    labels: sortedStates.map(s => s[0]),
    datasets: [{ label: 'Shop Count', data: sortedStates.map(s => s[1]), backgroundColor: '#0F4C81' }]
  }, { indexAxis: 'y', onClick: (e, elements) => { if(elements.length > 0) { activeStateDrilldown = sortedStates[elements[0].index][0]; updateDistrictDrilldown(); } } });

  updateDistrictDrilldown();

  const zoneMap = {};
  rawData.forEach(r => { const z = r['Zone'] || 'Unknown'; zoneMap[z] = (zoneMap[z] || 0) + 1; });
  drawChart('zoneDonut', 'doughnut', { labels: Object.keys(zoneMap), datasets: [{ data: Object.values(zoneMap), backgroundColor: ['#0F4C81','#2E7D32','#FF9800','#D32F2F','#9C27B0','#00BCD4','#795548'] }] });

  const typeMap = {};
  rawData.forEach(r => { const t = r['Franchise Type'] || 'Unknown'; typeMap[t] = (typeMap[t] || 0) + 1; });
  drawChart('typePie', 'pie', { labels: Object.keys(typeMap), datasets: [{ data: Object.values(typeMap), backgroundColor: ['#0F4C81','#2E7D32','#FF9800','#D32F2F','#9C27B0'] }] });

  drawChart('activeGauge', 'doughnut', {
    labels: ['Active', 'Inactive'],
    datasets: [{ data: [active, rawData.length - active], backgroundColor: ['#2E7D32', '#FFEBEE'], borderWidth: 0 }]
  }, { cutout: '70%' });
}

function updateDistrictDrilldown() {
  document.getElementById('districtDrillTitle').textContent = `Districts in ${activeStateDrilldown}`;
  const distMap = {};
  rawData.filter(r => r['State Name'] === activeStateDrilldown).forEach(r => {
    const d = r['District Name'] || 'Unknown';
    distMap[d] = (distMap[d] || 0) + 1;
  });
  const sortedDist = Object.entries(distMap).sort((a,b) => b[1]-a[1]).slice(0, 15);
  drawChart('districtDrillChart', 'bar', {
    labels: sortedDist.map(d => d[0]),
    datasets: [{ label: 'Shops', data: sortedDist.map(d => d[1]), backgroundColor: '#FF9800' }]
  }, { indexAxis: 'y', plugins: { legend: { display: false } } });
}

// --- PAGE 2 ---
function renderPage2() {
  const treeData = [];
  const stateMap = {};
  rawData.forEach(r => {
    const s = r['State Name'] || 'Unknown';
    const d = r['District Name'] || 'Unknown';
    if(!stateMap[s]) stateMap[s] = {};
    stateMap[s][d] = (stateMap[s][d] || 0) + 1;
  });
  Object.entries(stateMap).forEach(([state, dists]) => {
    Object.entries(dists).forEach(([dist, count]) => {
      treeData.push({ state, dist, count });
    });
  });

  const ctx = document.getElementById('treemap').getContext('2d');
  if(charts.treemap) charts.treemap.destroy();
  charts.treemap = new Chart(ctx, {
    type: 'treemap',
    data: { datasets: [{
      label: 'Treemap', tree: treeData, key: 'count', groups: ['state', 'dist'],
      backgroundColor: '#0F4C81', borderColor: 'white', borderWidth: 2, spacing: 1,
      labels: { display: true, padding: 5, color: 'white', font: { size: 12, weight: 'bold' } }
    }]},
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
  });

  const rankData = (key, id, color) => {
    const map = {};
    rawData.forEach(r => { const v = r[key] || 'Unknown'; map[v] = (map[v] || 0) + 1; });
    const sorted = Object.entries(map).sort((a,b) => b[1]-a[1]).slice(0, 20);
    drawChart(id, 'bar', { labels: sorted.map(s => s[0]), datasets: [{ data: sorted.map(s => s[1]), backgroundColor: color }] }, { indexAxis: 'y', plugins: { legend: { display: false } } });
  };
  rankData('District Name', 'topDistricts', '#2E7D32');
  rankData('City Name', 'topCities', '#0F4C81');
  rankData('warehouse_name', 'warehouseChart', '#FF9800');

  const matrixMap = {};
  rawData.forEach(r => {
    const k = `${r['Zone']||'-'}|${r['Region']||'-'}|${r['District Name']||'-'}`;
    if(!matrixMap[k]) matrixMap[k] = { count: 0, rev: 0 };
    matrixMap[k].count++;
    matrixMap[k].rev += num(r['FY 2025-26 Total Purchase']);
  });
  const matrixBody = document.getElementById('matrixBody');
  matrixBody.innerHTML = Object.entries(matrixMap).sort((a,b) => b[1].count - a[1].count).slice(0, 100).map(([k,v] => {
    const [zone, region, dist] = k.split('|');
    return `<tr><td>${zone}</td><td>${region}</td><td>${dist}</td><td>${v.count}</td><td>${fmtINR(v.rev)}</td></tr>`;
  }).join('');
}

// --- PAGE 3 ---
function renderPage3() {
  const rev24 = rawData.reduce((s,r) => s + num(r['FY 2024-25 Total Purchase']), 0);
  const rev25 = rawData.reduce((s,r) => s + num(r['FY 2025-26 Total Purchase']), 0);
  const rev26 = rawData.reduce((s,r) => s + num(r['FY 2026-27 Total Purchase']), 0);
  const growths = rawData.map(r => num(r['Growth % same period with last year'])).filter(g => g !== 0);
  const avgGrowth = growths.length ? growths.reduce((a,b)=>a+b,0)/growths.length : 0;

  document.getElementById('kpiRev24').textContent = fmtINR(rev24);
  document.getElementById('kpiRev25').textContent = fmtINR(rev25);
  document.getElementById('kpiRev26p3').textContent = fmtINR(rev26);
  document.getElementById('kpiGrowth').textContent = avgGrowth.toFixed(1) + '%';

  drawChart('yearCompare', 'bar', {
    labels: ['FY 24-25', 'FY 25-26', 'FY 26-27'],
    datasets: [{ label: 'Total Purchase', data: [rev24, rev25, rev26], backgroundColor: ['#0F4C81', '#2E7D32', '#FF9800'] }]
  });

  const months = ['Apr_25','May_25','Jun_25','Jul_25','Aug_25','Sep_25','Oct_25','Nov_25','Dec_25','Jan_26','Feb_26','Mar_26'];
  const monthLabels = ['Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec','Jan','Feb','Mar'];
  drawChart('monthlyTrend', 'line', {
    labels: monthLabels,
    datasets: [{ label: 'Purchase', data: months.map(m => rawData.reduce((s,r) => s + num(r[m]), 0)), borderColor: '#FF9800', backgroundColor: 'rgba(255,152,0,0.2)', fill: true, tension: 0.4 }]
  });

  const catMap = {'A+':0,'A':0,'B':0,'C':0,'D':0,'E':0};
  rawData.forEach(r => { const c = (r['FY 2025-26 Average Category'] || 'E').trim(); if(catMap[c] !== undefined) catMap[c]++; });
  drawChart('categoryStack', 'bar', {
    labels: ['Franchises'],
    datasets: Object.entries(catMap).map(([c,v]) => ({ label: c, data: [v], backgroundColor: { 'A+':'#2E7D32', 'A':'#0F4C81', 'B':'#FF9800', 'C':'#FFC107', 'D':'#FF5722', 'E':'#9E9E9E' }[c] }))
  }, { plugins: { legend: { position: 'right' } }, scales: { x: { stacked: true }, y: { stacked: true } } });

  const growthBody = document.getElementById('growthBody');
  const topGainers = rawData.map(r => ({ name: r['Franchise Name'], state: r['State Name'], growth: num(r['Growth % same period with last year']) }))
    .filter(g => g.growth > 0).sort((a,b) => b.growth - a.growth).slice(0, 15);
  growthBody.innerHTML = topGainers.map(g => `<tr><td>${g.name}</td><td>${g.state}</td><td><span class="badge b-green">+${g.growth.toFixed(1)}%</span></td></tr>`).join('');
}

// --- PAGE 4 ---
function renderTable() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  const s = document.getElementById('fState').value;
  const z = document.getElementById('fZone').value;
  const t = document.getElementById('fType').value;
  const c = document.getElementById('fCat').value;

  const filtered = rawData.filter(r => {
    if(s && r['State Name'] !== s) return false;
    if(z && r['Zone'] !== z) return false;
    if(t && r['Franchise Type'] !== t) return false;
    if(c && r['FY 2025-26 Average Category'] !== c) return false;
    if(q) {
      const hay = [r['Franchise Code'], r['Franchise Name'], r['owner Name'], r['Contact Number'], r['City Name']].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });

  document.getElementById('recordCount').textContent = `(${filtered.length} records found)`;
  document.getElementById('franchiseTable').innerHTML = filtered.slice(0, 200).map(r => {
    const cat = (r['FY 2025-26 Average Category'] || 'E').trim();
    const isActive = (r['Active 26-27'] || '').toLowerCase().includes('yes');
    return `<tr>
      <td><strong>${r['Franchise Code'] || ''}</strong></td>
      <td>${r['Franchise Name'] || ''}</td>
      <td>${r['owner Name'] || ''}</td>
      <td>${r['Contact Number'] || ''}</td>
      <td>${r['City Name'] || ''}</td>
      <td>${r['State Name'] || ''}</td>
      <td>${fmtINR(num(r['FY 2025-26 Total Purchase']))}</td>
      <td><span class="badge b-blue">${cat}</span></td>
      <td><span class="badge ${isActive ? 'b-green' : 'b-red'}">${isActive ? 'Active' : 'Inactive'}</span></td>
    </tr>`;
  }).join('');
}

function drawChart(id, type, data, opts = {}) {
  const ctx = document.getElementById(id).getContext('2d');
  if(charts[id]) charts[id].destroy();
  charts[id] = new Chart(ctx, { type, data, options: { responsive: true, maintainAspectRatio: false, ...opts } });
}
</script>
