<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CEO Franchise Master Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-chart-treemap@2.3.0/dist/chartjs-chart-treemap.min.js"></script>
<style>
  :root {
    --bg: #F5F7FA;
    --card: #FFFFFF;
    --primary: #0F4C81;
    --success: #2E7D32;
    --warning: #FF9800;
    --danger: #D32F2F;
    --text: #263238;
    --muted: #78909C;
    --border: #E0E0E0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    min-height: 100vh;
  }
 
  .sidebar {
    width: 240px;
    background: var(--primary);
    color: white;
    padding: 20px 0;
    flex-shrink: 0;
    box-shadow: 2px 0 10px rgba(0,0,0,0.1);
    position: sticky;
    top: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .sidebar h1 {
    font-size: 18px;
    padding: 0 20px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.2);
    margin-bottom: 20px;
  }
  .nav-btn {
    text-align: left;
    padding: 15px 20px;
    background: none;
    border: none;
    color: rgba(255,255,255,0.8);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    border-left: 4px solid transparent;
  }
  .nav-btn:hover { background: rgba(255,255,255,0.1); color: white; }
  .nav-btn.active { background: rgba(255,255,255,0.15); color: white; border-left-color: var(--warning); }
 
  .main-content { flex: 1; padding: 25px 30px; overflow-x: hidden; }
 
  .page { display: none; animation: fadeIn 0.4s ease; }
  .page.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
 
  .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 10px; }
  .page-header h2 { font-size: 22px; color: var(--primary); }
  .timestamp { font-size: 12px; color: var(--muted); background: var(--card); padding: 6px 12px; border-radius: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
 
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 25px; }
  .kpi-card { background: var(--card); padding: 18px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border-top: 4px solid var(--primary); }
  .kpi-card.success { border-top-color: var(--success); }
  .kpi-card.warning { border-top-color: var(--warning); }
  .kpi-card.danger { border-top-color: var(--danger); }
  .kpi-card .label { font-size: 12px; color: var(--muted); text-transform: uppercase; font-weight: 600; }
  .kpi-card .value { font-size: 24px; font-weight: 700; margin-top: 8px; color: var(--text); }
  .kpi-card .sub { font-size: 11px; color: var(--muted); margin-top: 5px; }
 
  .chart-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; margin-bottom: 20px; }
  .panel { background: var(--card); border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .panel h3 { font-size: 15px; color: var(--primary); margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
  .chart-box { position: relative; height: 300px; }
  .chart-box.tall { height: 400px; }
 
  .matrix-table, .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .matrix-table th, .matrix-table td, .data-table th, .data-table td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
  .matrix-table th, .data-table th { background: #FAFAFA; color: var(--primary); font-weight: 600; cursor: pointer; }
  .matrix-table tr:hover, .data-table tr:hover { background: #F5F9FF; }
  .table-wrap { max-height: 500px; overflow: auto; border: 1px solid var(--border); border-radius: 8px; }
 
  .filter-bar { background: var(--card); padding: 15px 20px; border-radius: 10px; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 15px; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .filter-bar input, .filter-bar select { padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; }
  .filter-bar input { flex: 1; min-width: 200px; }
 
  .badge { padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: 700; }
  .b-green { background: #E8F5E9; color: #2E7D32; }
  .b-red { background: #FFEBEE; color: #C62828; }
  .b-blue { background: #E3F2FD; color: #1565C0; }
 
  #loader { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999; }
  .spinner { width: 40px; height: 40px; border: 4px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
 
  .error-box {
    background: #ffebee; color: #c62828; padding: 30px; border-radius: 10px; max-width: 550px;
    text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  }
</style>
</head>
<body>

<script>

// Helpers
const num = v => { 
  if(!v) return 0; 
  const s = String(v).replace(/,/g,'').replace(/₹/g,'').trim(); 
  if(s===''||s==='*'||s==='#N/A'||s==='NULL') return 0; 
  const n = parseFloat(s); 
  return isNaN(n) ? 0 : n; 
};

const fmtINR = n => n >= 10000000 ? '₹'+(n/10000000).toFixed(2)+' Cr' : 
                 n >= 100000 ? '₹'+(n/100000).toFixed(2)+' L' : '₹'+Math.round(n);

const fmtNum = n => new Intl.NumberFormat('en-IN').format(Math.round(n));

// Navigation
function showPage(id, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function showError(msg) {
  const loader = document.getElementById('loader');
  loader.innerHTML = `
    <div class="error-box">
      <h2>Dashboard Error</h2>
      <p>${msg}</p>
      <hr>
      <div class="fix-list">Check browser console (F12) for details.</div>
    </div>
  `;
}

// Load Data
fetch('./data.csv', { cache: 'no-store' })
  .then(res => {
    if (!res.ok) throw new Error(`HTTP ${res.status} - data.csv not found`);
    return res.text();
  })
  .then(csvText => {
    const res = Papa.parse(csvText, { header: true, skipEmptyLines: true });
    rawData = res.data.filter(r => r['Franchise Code']);
    if(rawData.length === 0) throw new Error("No rows with 'Franchise Code' found");
    initApp();
  })
  .catch(err => {
    console.error(err);
    showError(err.message);
  });

function initApp() {
  try {

    document.querySelectorAll('.timestamp').forEach(el => el.textContent = 'Last Refreshed: ' + ts);
   
    populateFilters();
    renderPage1();
    renderPage2();
    renderPage3();
    renderTable();
    document.getElementById('loader').style.display = 'none';
  } catch (e) {
    console.error(e);
    showError("Error building dashboard: " + e.message);
  }
}

</body>
</html>
